<!DOCTYPE html>
<html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radar IFCH V6.2 - PA + Filosofia</title>
<style>
body{font-family:Inter,Arial;max-width:1000px;margin:auto;padding:20px;background:#f8fafc}
h1{font-size:20px}
.tabs{display:flex;gap:8px;margin:16px 0}
.tab{padding:8px 14px;border-radius:20px;border:1px solid #ddd;cursor:pointer;background:#fff}
.tab.active{background:#111;color:#fff}
.card{border:1px solid #e5e7eb;background:#fff;padding:14px;margin:10px 0;border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;margin-right:6px;font-weight:700}
.badge-pa{background:#16a34a;color:#fff}
.badge-ifch{background:#2563eb;color:#fff}
.badge-pal{background:#9333ea;color:#fff}
a{color:#2563eb;word-break:break-all}
.header{background:#fff;border:1px solid #e5e7eb;padding:16px;border-radius:12px;margin-bottom:16px}
</style></head><body>
<div class="header">
<h1 id="titulo">Radar IFCH V6.2 - 2026-08-30 - BANCO: carregando...</h1>
<p style="color:#666;font-size:13px">Filtro: Presencial = RMB Belém + Online = Brasil Filosofia/Ciências Humanas | Fonte: PCI_PA + UFPA + FADESP + CEBRASPE | Atualização 10h e 22h</p>
<div class="tabs">
<div class="tab active" onclick="showTab('pa')">Concursos PA (<span id="c-pa">0</span>)</div>
<div class="tab" onclick="showTab('ifch')">IFCH/UFPA (<span id="c-ifch">0</span>)</div>
<div class="tab" onclick="showTab('pal')">Palestras (<span id="c-pal">0</span>)</div>
</div>
</div>
<div id="list-pa"></div>
<div id="list-ifch" style="display:none"></div>
<div id="list-pal" style="display:none"></div>

<script>
let DB={pa:[],ifch:[],pal:[]};
function card(c,cls,label){
 return `<div class="card"><span class="badge ${cls}">${label}</span><b>${c.titulo}</b><br><a href="${c.link}" target="_blank">${c.link}</a></div>`;
}
function render(){
 document.getElementById('c-pa').textContent=DB.pa.length;
 document.getElementById('c-ifch').textContent=DB.ifch.length;
 document.getElementById('c-pal').textContent=DB.pal.length;
 document.getElementById('titulo').textContent=`Radar IFCH V6.2 - 2026-08-30 - BANCO: ${DB.pa.length+DB.ifch.length+DB.pal.length} | ${DB.pa.length} concursos PA + ${DB.ifch.length} IFCH + ${DB.pal.length} palestras`;
 document.getElementById('list-pa').innerHTML=DB.pa.map(c=>card(c,'badge-pa',c.titulo.split(']')[0].replace('[',''))).join('') || '<div class=card>Nenhum concurso PA hoje</div>';
 document.getElementById('list-ifch').innerHTML=DB.ifch.map(c=>card(c,'badge-ifch','IFCH')).join('');
 document.getElementById('list-pal').innerHTML=DB.pal.map(c=>card(c,'badge-pal','PALESTRA')).join('') || '<div class=card>Nenhuma palestra - V6.3 em implantação</div>';
}
function showTab(t){
 document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));
 document.getElementById('list-pa').style.display=t==='pa'?'block':'none';
 document.getElementById('list-ifch').style.display=t==='ifch'?'block':'none';
 document.getElementById('list-pal').style.display=t==='pal'?'block':'none';
 event.target.classList.add('active');
}
Promise.all([
 fetch('arquivo/todos_concursos.json?'+Date.now()).then(r=>r.json()),
 fetch('arquivo/todos_ifch.json?'+Date.now()).then(r=>r.json()),
 fetch('arquivo/todos_palestras.json?'+Date.now()).then(r=>r.json())
]).then(([pa][ifch][pal])=>{DB={pa,ifch,pal}; render();});
</script>
</body></html>

<!DOCTYPE html><html><head><meta charset=utf-8><title>Radar IFCH V6.2 PA-Filo</title>
<style>body{font-family:Arial;max-width:900px;margin:auto;padding:20px} .card{border:1px solid #ddd;padding:12px;margin:8px 0;border-radius:8px} .badge{background:#0a0;color:#fff;padding:2px 6px;border-radius:4px;font-size:11px} a{color:#06c}</style></head><body>
<h2>Radar IFCH V6.2 - 2026-08-30 - BANCO: 8 | 3 concursos PA + 5 IFCH</h2>
<div id="concursos"></div>
<script>
fetch('arquivo/todos_concursos.json?'+Date.now()).then(r=>r.json()).then(data=>{
let h=document.getElementById('concursos');
if(data.length==0) h.innerHTML='<p>Nenhum concurso PA hoje - aguardando coleta 22h</p>';
data.forEach(c=>{
let d=document.createElement('div'); d.className='card';
d.innerHTML=`<span class=badge>${c.titulo.split(']')[0].replace('[','')} </span> <b>${c.titulo}</b><br><a href="${c.link}" target="_blank">${c.link}</a>`;
h.appendChild(d);
})
});
fetch('arquivo/todos_ifch.json?'+Date.now()).then(r=>r.json()).then(data=>{/* IFCH */});
</script></body></html>

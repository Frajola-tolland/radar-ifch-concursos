name: Radar V6.5 ACTIVE-ONLY
on:
  schedule:
    - cron: "0 */3 * * *"  # a cada 3h ao invés de 1h
  workflow_dispatch:

jobs:
  coleta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - name: Coleta só ativos
        run: python radar-concursos/radar_multifonte_v6.py
      - name: Gera index ACTIVE
        run: python scripts/gerar_index.py
      - name: Commit
        run: |
          git config user.name "bot-radar"
          git config user.email "bot@radar.pa"
          git add arquivo/ index.html
          git commit -m "V6.5 auto $(date +%F-%H%M) - ${{ github.run_number }} PA ativos" || exit 0
          git push

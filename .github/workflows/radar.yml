name: Radar Diario V6.3.4 PA-TOTAL-FIXLINK
on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:
jobs:
  raspar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 lxml
      - run: |
          TODAY=$(date +%F)
          mkdir -p arquivo/$TODAY
          python radar-concursos/radar_multifonte_v6.py || true
          python radar-ifch/radar_ifch.py || true
          python radar-palestras/radar_palestras_v63.py || true
          python scripts/valida_links.py || true
          python scripts/gerar_index.py
      - run: |
          git config user.name "radar-bot"
          git config user.email "radar@frajola.system"
          git add arquivo/ index.html
          git diff --staged --quiet || git commit -m "V6.3.4 auto $(date +%F-%H%M) PA-TOTAL link check"
          git push

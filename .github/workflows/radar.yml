name: Radar Diario V6.3 PA-Filo-Pal
on:
  schedule:
    - cron: '0 10 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:
jobs:
  raspar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 lxml
      - run: |
          TODAY=$(date +%F)
          mkdir -p arquivo/$TODAY
          python radar-concursos/radar_multifonte_v6.py || true
          python radar-ifch/radar_ifch.py || true
          python radar-palestras/radar_palestras_v63.py || true
          python scripts/gerar_index.py
          echo "=== BANCO V6.3 ==="
          cat arquivo/todos_concursos.json | wc -l
          cat arquivo/todos_ifch.json | wc -l
          cat arquivo/todos_palestras.json | wc -l
          cat arquivo/$TODAY/palestras.txt || echo "sem palestras hoje"
      - run: |
          git config user.name "radar-bot"
          git config user.email "radar@frajola.system"
          git add arquivo/ index.html || true
          git diff --staged --quiet || git commit -m "V6.3 auto coleta $(date +%F-%H%M) PA+IFCH+Palestras"
          git push
